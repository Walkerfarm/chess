<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Chess vs Bot</title>

  <style>
    html { overflow-y: scroll; overflow-x: hidden; }
    body { margin:0; overflow-x:hidden; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root{
      --light:#f0d9b5;
      --dark:#b58863;
      --sel:#3aa1ff;
      --panel:#1f2430;
      --text:#e7eaf0;
      --bg:#0f1220;

      /* internal fixed board */
      --sq: 65px;
      --board: 520px;

      /* uniform scale for any screen size */
      --scale: 1;
      --scaledBoard: 520px;
      --gap: 14px;
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding:
        calc(env(safe-area-inset-top) + 14px)
        calc(env(safe-area-inset-right) + 14px)
        calc(env(safe-area-inset-bottom) + 14px)
        calc(env(safe-area-inset-left) + 14px);
      display:flex;
      justify-content:center;
    }

    /* Rotate the whole app (manual or auto 180° flip) */
    #app{
      transform: rotate(0deg);
      transform-origin: center center;
      width: min(1100px, 100%);
    }

    .wrap{
      width: 100%;
      display:flex;
      gap: var(--gap);
      align-items:flex-start;
      flex-direction: column;
    }
    @media (min-width: 900px){
      .wrap{ flex-direction: row; flex-wrap: nowrap; }
    }

    .board-wrap{
      width: var(--scaledBoard);
      height: var(--scaledBoard);
      flex: 0 0 auto;
    }

    .board{
      width: var(--board);
      height: var(--board);
      display:grid;
      grid-template-columns: repeat(8, var(--sq));
      grid-template-rows: repeat(8, var(--sq));
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 12px;
      overflow:hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,.45);
      user-select:none;
      touch-action: manipulation;

      transform: scale(var(--scale));
      transform-origin: top left;
      will-change: transform;
    }

    .sq{
      width: var(--sq);
      height: var(--sq);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      position:relative;
      font-size: 44px; /* fixed, scaled with board */
      line-height: 1;
      font-family: "Segoe UI Symbol","Noto Sans Symbols2","Apple Symbols",system-ui,sans-serif;
    }

    .light{ background: var(--light); color:#111; }
    .dark{ background: var(--dark); color:#111; }
    .sq.sel{ outline: 4px solid var(--sel); outline-offset:-4px; }

    .sq.hint::after{
      content:"";
      width: 16px; height:16px;
      background: rgba(0,0,0,.25);
      border-radius: 50%;
      position:absolute;
    }
    .sq.cap::after{
      content:"";
      width: 46px; height:46px;
      border: 4px solid rgba(0,0,0,.28);
      border-radius: 50%;
      position:absolute;
      box-sizing:border-box;
    }
    .sq.check{ box-shadow: inset 0 0 0 6px rgba(255,0,0,.35); }

    /* 3D-ish pieces */
    .piece{
      display:inline-block;
      transform: translateY(-1px);
      text-shadow:
        0 1px 0 rgba(255,255,255,.35),
        0 2px 0 rgba(255,255,255,.18),
        0 6px 10px rgba(0,0,0,.35),
        0 2px 2px rgba(0,0,0,.35);
      filter: drop-shadow(0 6px 6px rgba(0,0,0,.22));
    }
    .piece.w{
      text-shadow:
        0 1px 0 rgba(255,255,255,.55),
        0 2px 0 rgba(255,255,255,.25),
        0 6px 10px rgba(0,0,0,.35),
        0 2px 2px rgba(0,0,0,.35);
    }
    .piece.b{
      text-shadow:
        0 1px 0 rgba(255,255,255,.18),
        0 6px 12px rgba(0,0,0,.45),
        0 2px 2px rgba(0,0,0,.45);
      filter: drop-shadow(0 7px 7px rgba(0,0,0,.28));
    }

    .panel{
      width: 100%;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
      flex: 0 0 auto;
    }
    @media (min-width: 900px){
      .panel{ width: 400px; flex: 0 0 400px; }
    }

    .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }

    button, select{
      background:#2a3143;
      color:var(--text);
      border:1px solid rgba(255,255,255,.12);
      padding:10px 12px;
      border-radius:10px;
      cursor:pointer;
      font-weight:600;
    }
    button:hover, select:hover{ filter:brightness(1.08); }
    button:disabled{ opacity:.55; cursor:not-allowed; }

    .small{ font-size:12px; opacity:.8; line-height:1.35; }

    .status{
      margin-top:10px;
      padding:10px 12px;
      background:#151a25;
      border:1px solid rgba(255,255,255,.10);
      border-radius:10px;
      min-height:44px;
      white-space:pre-wrap;
    }

    .moves{
      margin-top:10px;
      padding:10px 12px;
      background:#151a25;
      border:1px solid rgba(255,255,255,.10);
      border-radius:10px;
      max-height: 240px;
      overflow-y: scroll;
      scrollbar-gutter: stable;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height:1.4;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:#151a25;
      border:1px solid rgba(255,255,255,.10);
      font-size:13px;
      margin-top:10px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="wrap">
      <div>
        <div class="board-wrap">
          <div id="board" class="board" aria-label="Chess board"></div>
        </div>
        <div class="small" style="margin-top:10px; opacity:.85;">
          iPhone note: iOS usually won’t rotate to upside-down portrait. Use Auto 180° Flip or Rotate 180°.
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <button id="newBtn">New Game</button>
          <button id="undoBtn">Undo</button>
          <button id="flipBtn">Flip Board</button>
          <button id="musicBtn">Music: Off</button>
          <button id="autoFlipBtn">Auto 180° Flip: Off</button>
          <button id="rotate180Btn">Rotate 180°</button>
        </div>

        <div class="row" style="margin-top:10px;">
          <span class="tag">Bot strength:
            <select id="depthSel">
              <option value="1">Very Easy (Depth 1)</option>
              <option value="2" selected>Easy (Depth 2)</option>
              <option value="3">Medium (Depth 3)</option>
              <option value="4">Hard (Depth 4)</option>
            </select>
          </span>

          <span class="tag">Bot:
            <select id="botOnSel">
              <option value="on" selected>On</option>
              <option value="off">Off</option>
            </select>
          </span>

          <span class="tag">Music volume:
            <select id="volSel">
              <option value="0.06">Low</option>
              <option value="0.10" selected>Med</option>
              <option value="0.14">High</option>
            </select>
          </span>
        </div>

        <div class="status" id="status"></div>
        <div class="moves" id="moves"></div>

        <div class="small" style="margin-top:10px;">
          Audio starts only after a tap on iPhone. Music toggle fully stops (fade out + stop sources).
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  /* ========= Uniform scale for any rotation ========= */
  function setScale(){
    const BASE = 520;
    const vw = Math.min(window.innerWidth, document.documentElement.clientWidth || window.innerWidth);
    const vh = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
    const isLandscape = vw > vh;

    const maxW = Math.floor(vw * 0.92);
    const maxH = Math.floor(vh * (isLandscape ? 0.80 : 0.62));

    const target = Math.min(BASE, maxW, maxH);
    const scale = Math.max(0.45, Math.min(1, target / BASE));
    const scaled = Math.round(BASE * scale);

    document.documentElement.style.setProperty("--scale", String(scale));
    document.documentElement.style.setProperty("--scaledBoard", scaled + "px");
  }
  setScale();
  window.addEventListener("resize", setScale, {passive:true});
  window.addEventListener("orientationchange", () => setTimeout(setScale, 80), {passive:true});

  /* ========= 180° UI rotation (manual + auto via devicemotion) ========= */
  const appEl = document.getElementById("app");
  const autoFlipBtn = document.getElementById("autoFlipBtn");
  const rotate180Btn = document.getElementById("rotate180Btn");

  let autoFlipOn = false;
  let lastFlip = 0; // 0 or 180
  let motionHandler = null;

  function applyFlip(deg){
    deg = (deg === 180) ? 180 : 0;
    if (deg === lastFlip) return;
    lastFlip = deg;
    appEl.style.transform = `rotate(${deg}deg)`;
  }

  rotate180Btn.addEventListener("click", () => {
    applyFlip(lastFlip === 0 ? 180 : 0);
  });

  async function requestMotionPermission(){
    if (typeof DeviceMotionEvent === "undefined") return false;

    // iOS requires permission
    if (typeof DeviceMotionEvent.requestPermission === "function") {
      try{
        const res = await DeviceMotionEvent.requestPermission();
        return res === "granted";
      } catch {
        return false;
      }
    }
    return true;
  }

  function startAutoFlip(){
    motionHandler = (e) => {
      const g = e.accelerationIncludingGravity;
      if(!g) return;

      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const landscape = vw > vh;

      const TH = 7.0; // threshold against ~9.8 gravity

      // Use y in portrait, x in landscape. Flip when strongly inverted.
      if(!landscape){
        if (g.y <= -TH) applyFlip(180);
        else if (g.y >= TH) applyFlip(0);
      } else {
        if (g.x <= -TH) applyFlip(180);
        else if (g.x >= TH) applyFlip(0);
      }
    };

    window.addEventListener("devicemotion", motionHandler, { passive: true });
  }

  function stopAutoFlip(){
    if(motionHandler){
      window.removeEventListener("devicemotion", motionHandler);
      motionHandler = null;
    }
    applyFlip(0);
  }

  autoFlipBtn.addEventListener("click", async () => {
    if(!autoFlipOn){
      const ok = await requestMotionPermission();
      if(!ok){
        alert(
          "Auto 180° Flip needs Motion access.\n\n" +
          "If you tapped 'Don't Allow' earlier, Safari may remember it.\n" +
          "Try: Settings → Safari → Clear History and Website Data, then reload and tap Auto Flip again."
        );
        return;
      }
      startAutoFlip();
      autoFlipOn = true;
      autoFlipBtn.textContent = "Auto 180° Flip: On";
    } else {
      stopAutoFlip();
      autoFlipOn = false;
      autoFlipBtn.textContent = "Auto 180° Flip: Off";
    }
  });

  /* ========= Peaceful music (soft pad + sparse chimes) ========= */
  const musicBtn = document.getElementById("musicBtn");
  const volSel = document.getElementById("volSel");

  let audioCtx = null;
  let musicOn = false;

  let outGain = null;
  let padGain = null;

  let padOscs = [];
  let chimeTimer = null;

  // internal routing helpers
  let dryIn = null;
  let wetIn = null;

  function createImpulseResponse(ctx, seconds=2.2, decay=3.5){
    const rate = ctx.sampleRate;
    const length = Math.floor(rate * seconds);
    const impulse = ctx.createBuffer(2, length, rate);
    for(let ch=0; ch<2; ch++){
      const data = impulse.getChannelData(ch);
      for(let i=0; i<length; i++){
        const t = i/length;
        data[i] = (Math.random()*2-1) * Math.pow(1 - t, decay);
      }
    }
    return impulse;
  }

  function ensureAudio(){
    if(audioCtx) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // final output gain: THIS makes Off truly silent
    outGain = audioCtx.createGain();
    outGain.gain.value = 0.0;
    outGain.connect(audioCtx.destination);

    dryIn = audioCtx.createGain();
    wetIn = audioCtx.createGain();
    dryIn.gain.value = 1.0;
    wetIn.gain.value = 1.0;

    // Gentle reverb + echo
    const convolver = audioCtx.createConvolver();
    convolver.buffer = createImpulseResponse(audioCtx);

    const delay = audioCtx.createDelay(1.0);
    delay.delayTime.value = 0.26;

    const fb = audioCtx.createGain();
    fb.gain.value = 0.25;
    delay.connect(fb);
    fb.connect(delay);

    const wetOut = audioCtx.createGain();
    wetOut.gain.value = 0.35;
    const dryOut = audioCtx.createGain();
    dryOut.gain.value = 0.75;

    // route wet
    wetIn.connect(convolver);
    convolver.connect(wetOut);
    wetOut.connect(outGain);

    wetIn.connect(delay);
    delay.connect(wetOut);

    // route dry
    dryIn.connect(dryOut);
    dryOut.connect(outGain);

    // pad chain
    padGain = audioCtx.createGain();
    padGain.gain.value = 0.08;

    const lp = audioCtx.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 650;
    lp.Q.value = 0.6;

    padGain.connect(lp);
    lp.connect(dryIn);
    lp.connect(wetIn);
  }

  function startPad(){
    // A minor calm pad: A3 C4 E4 (soft)
    const freqs = [220.00, 261.63, 329.63];
    padOscs = freqs.map((f, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = (i===0) ? "sine" : "triangle";
      o.frequency.value = f;
      o.detune.value = (i-1)*2.5;
      g.gain.value = 0.18;
      o.connect(g);
      g.connect(padGain);
      o.start();
      return {o,g};
    });

    // slow “breathing” volume
    const breath = audioCtx.createOscillator();
    const breathGain = audioCtx.createGain();
    breath.type = "sine";
    breath.frequency.value = 0.06;
    breathGain.gain.value = 0.05;
    breath.connect(breathGain);
    breathGain.connect(padGain.gain);
    breath.start();
    startPad._breath = breath;
  }

  function stopPad(){
    try{ if(startPad._breath) startPad._breath.stop(); } catch {}
    startPad._breath = null;
    for(const v of padOscs){
      try{ v.o.stop(); } catch {}
    }
    padOscs = [];
  }

  function playChime(freq){
    const t = audioCtx.currentTime;

    const o1 = audioCtx.createOscillator();
    const o2 = audioCtx.createOscillator();
    o1.type = "sine";
    o2.type = "sine";
    o1.frequency.setValueAtTime(freq, t);
    o2.frequency.setValueAtTime(freq*2.01, t);

    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);

    const hp = audioCtx.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 200;

    o1.connect(hp);
    o2.connect(hp);
    hp.connect(g);

    g.connect(dryIn);
    g.connect(wetIn);

    o1.start(t);
    o2.start(t);
    o1.stop(t + 2.4);
    o2.stop(t + 2.4);
  }

  function startChimes(){
    const pool = [220, 261.63, 293.66, 329.63, 392.00, 440, 523.25]; // A C D E G (+ octaves)
    let last = -1;

    chimeTimer = setInterval(() => {
      if(!musicOn) return;
      if(Math.random() < 0.28) return; // sparse

      let idx = Math.floor(Math.random() * pool.length);
      if(idx === last) idx = (idx + 1) % pool.length;
      last = idx;

      playChime(pool[idx]);
    }, 1500);
  }

  function stopChimes(){
    if(chimeTimer){
      clearInterval(chimeTimer);
      chimeTimer = null;
    }
  }

  async function setMusic(on){
    ensureAudio();

    if(audioCtx.state === "suspended"){
      try{ await audioCtx.resume(); } catch {}
    }

    const targetVol = Math.max(0.02, Math.min(0.20, parseFloat(volSel.value || "0.10")));
    const now = audioCtx.currentTime;

    if(on){
      musicOn = true;
      if(padOscs.length === 0) startPad();
      if(!chimeTimer) startChimes();

      outGain.gain.cancelScheduledValues(now);
      outGain.gain.setValueAtTime(outGain.gain.value, now);
      outGain.gain.linearRampToValueAtTime(targetVol, now + 0.8);
    } else {
      musicOn = false;
      outGain.gain.cancelScheduledValues(now);
      outGain.gain.setValueAtTime(outGain.gain.value, now);
      outGain.gain.linearRampToValueAtTime(0.0, now + 0.6);

      // HARD STOP sources after fade so it cannot keep playing
      setTimeout(() => {
        stopChimes();
        stopPad();
        audioCtx.suspend().catch(()=>{});
      }, 650);
    }
  }

  musicBtn.addEventListener("click", async () => {
    if(!musicOn){
      await setMusic(true);
      musicBtn.textContent = "Music: On";
    } else {
      await setMusic(false);
      musicBtn.textContent = "Music: Off";
    }
  });

  volSel.addEventListener("change", () => {
    if(!audioCtx || !musicOn) return;
    const now = audioCtx.currentTime;
    const targetVol = Math.max(0.02, Math.min(0.20, parseFloat(volSel.value || "0.10")));
    outGain.gain.cancelScheduledValues(now);
    outGain.gain.setValueAtTime(outGain.gain.value, now);
    outGain.gain.linearRampToValueAtTime(targetVol, now + 0.25);
  });

  /* ========= Chess engine/UI ========= */
  const UPIECES = {
    w: { K:"♔", Q:"♕", R:"♖", B:"♗", N:"♘", P:"♙" },
    b: { K:"♚", Q:"♛", R:"♜", B:"♝", N:"♞", P:"♟" }
  };

  const initialBoard = () => ([
    ["bR","bN","bB","bQ","bK","bB","bN","bR"],
    ["bP","bP","bP","bP","bP","bP","bP","bP"],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ["wP","wP","wP","wP","wP","wP","wP","wP"],
    ["wR","wN","wB","wQ","wK","wB","wN","wR"]
  ]);

  const pieceVal = { P:100, N:320, B:330, R:500, Q:900, K:20000 };

  const PST = {
    P: [
      [ 0, 0, 0, 0, 0, 0, 0, 0],
      [ 5,10,10,-20,-20,10,10, 5],
      [ 5,-5,-10, 0, 0,-10,-5, 5],
      [ 0, 0, 0, 20, 20, 0, 0, 0],
      [ 5, 5,10, 25, 25,10, 5, 5],
      [10,10,20, 30, 30,20,10,10],
      [50,50,50, 50, 50,50,50,50],
      [ 0, 0, 0, 0, 0, 0, 0, 0],
    ],
    N: [
      [-50,-40,-30,-30,-30,-30,-40,-50],
      [-40,-20, 0, 0, 0, 0,-20,-40],
      [-30, 0,10,15,15,10, 0,-30],
      [-30, 5,15,20,20,15, 5,-30],
      [-30, 0,15,20,20,15, 0,-30],
      [-30, 5,10,15,15,10, 5,-30],
      [-40,-20, 0, 5, 5, 0,-20,-40],
      [-50,-40,-30,-30,-30,-30,-40,-50],
    ],
    B: [
      [-20,-10,-10,-10,-10,-10,-10,-20],
      [-10, 0, 0, 0, 0, 0, 0,-10],
      [-10, 0, 5,10,10, 5, 0,-10],
      [-10, 5, 5,10,10, 5, 5,-10],
      [-10, 0,10,10,10,10, 0,-10],
      [-10,10,10,10,10,10,10,-10],
      [-10, 5, 0, 0, 0, 0, 5,-10],
      [-20,-10,-10,-10,-10,-10,-10,-20],
    ],
    R: [
      [ 0, 0, 0, 5, 5, 0, 0, 0],
      [-5, 0, 0, 0, 0, 0, 0,-5],
      [-5, 0, 0, 0, 0, 0, 0,-5],
      [-5, 0, 0, 0, 0, 0, 0,-5],
      [-5, 0, 0, 0, 0, 0, 0,-5],
      [-5, 0, 0, 0, 0, 0, 0,-5],
      [ 5,10,10,10,10,10,10, 5],
      [ 0, 0, 0, 0, 0, 0, 0, 0],
    ],
    Q: [
      [-20,-10,-10, -5, -5,-10,-10,-20],
      [-10, 0, 0, 0, 0, 0, 0,-10],
      [-10, 0, 5, 5, 5, 5, 0,-10],
      [ -5, 0, 5, 5, 5, 5, 0, -5],
      [ 0, 0, 5, 5, 5, 5, 0, -5],
      [-10, 5, 5, 5, 5, 5, 0,-10],
      [-10, 0, 5, 0, 0, 0, 0,-10],
      [-20,-10,-10, -5, -5,-10,-10,-20],
    ],
    K: [
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-30,-40,-40,-50,-50,-40,-40,-30],
      [-20,-30,-30,-40,-40,-30,-30,-20],
      [-10,-20,-20,-20,-20,-20,-20,-10],
      [ 20, 20, 0, 0, 0, 0, 20, 20],
      [ 20, 30,10, 0, 0,10, 30, 20],
    ],
  };

  function newGameState(){
    return {
      b: initialBoard(),
      turn: "w",
      castle: { wK:true, wQ:true, bK:true, bQ:true },
      ep: null,
      halfmove: 0,
      fullmove: 1,
      history: [],
      moveList: []
    };
  }

  const boardEl = document.getElementById("board");
  const statusEl = document.getElementById("status");
  const movesEl = document.getElementById("moves");
  const newBtn = document.getElementById("newBtn");
  const undoBtn = document.getElementById("undoBtn");
  const flipBtn = document.getElementById("flipBtn");
  const depthSel = document.getElementById("depthSel");
  const botOnSel = document.getElementById("botOnSel");

  let S = newGameState();
  let flipped = false;

  let selected = null;
  let legalForSelected = [];
  let botBusy = false;

  function renderMoves(){
    let out = "";
    for(let i=0;i<S.moveList.length;i++){
      if(i%2===0) out += `${1 + (i/2)}. `;
      out += S.moveList[i] + (i%2===0 ? " " : "\n");
    }
    movesEl.textContent = out.trim() || "Moves will appear here.";
  }

  function render(){
    boardEl.innerHTML = "";
    const b = S.b;
    const isCheck = inCheck(S, S.turn);

    for(let idx=0; idx<64; idx++){
      const r0 = Math.floor(idx/8);
      const c0 = idx%8;
      const r = flipped ? (7-r0) : r0;
      const c = flipped ? (7-c0) : c0;

      const sq = document.createElement("div");
      sq.className = "sq " + (((r0+c0)%2===0) ? "light":"dark");
      sq.dataset.r = r;
      sq.dataset.c = c;

      const p = b[r][c];
      if(p){
        const col = p[0], type=p[1];
        const span = document.createElement("span");
        span.className = "piece " + (col==="w" ? "w" : "b");
        span.textContent = UPIECES[col][type];
        sq.appendChild(span);
      }

      if(selected && selected.r===r && selected.c===c) sq.classList.add("sel");
      for(const mv of legalForSelected){
        if(mv.to.r===r && mv.to.c===c) sq.classList.add(b[r][c] ? "cap" : "hint");
      }

      if(isCheck){
        const kp = findKing(S, S.turn);
        if(kp && kp.r===r && kp.c===c) sq.classList.add("check");
      }

      sq.addEventListener("click", onSquareClick);
      boardEl.appendChild(sq);
    }

    const end = gameStatus(S);
    let line = `Turn: ${S.turn==="w" ? "White" : "Black"}\n`;
    if(end.over) line += end.message;
    else{
      line += (inCheck(S,S.turn) ? "Check!\n" : "");
      line += `Bot: ${botOnSel.value==="on" ? "On" : "Off"} | Depth: ${depthSel.value}` + (botBusy ? " | Thinking..." : "");
    }
    statusEl.textContent = line;

    undoBtn.disabled = (S.history.length===0);
    renderMoves();
  }

  function onSquareClick(e){
    if(botBusy) return;

    const r = +e.currentTarget.dataset.r;
    const c = +e.currentTarget.dataset.c;
    const p = S.b[r][c];

    const end = gameStatus(S);
    if(end.over) return;
    if(S.turn==="b" && botOnSel.value==="on") return;

    if(selected){
      const mv = legalForSelected.find(m => m.to.r===r && m.to.c===c);
      if(mv){
        makeMove(S, mv, true);
        selected = null;
        legalForSelected = [];
        render();
        maybeBotMove();
        return;
      }
      if(p && p[0]===S.turn){
        selected = {r,c};
        legalForSelected = legalMovesFrom(S, r, c);
        render();
        return;
      }
      selected = null;
      legalForSelected = [];
      render();
      return;
    } else {
      if(p && p[0]===S.turn){
        selected = {r,c};
        legalForSelected = legalMovesFrom(S, r, c);
        render();
      }
    }
  }

  newBtn.addEventListener("click", () => {
    S = newGameState();
    selected = null;
    legalForSelected = [];
    botBusy = false;
    render();
    maybeBotMove();
  });
  undoBtn.addEventListener("click", () => {
    if(botBusy) return;
    undo(S);
    selected = null;
    legalForSelected = [];
    render();
  });
  flipBtn.addEventListener("click", () => { flipped = !flipped; render(); });
  depthSel.addEventListener("change", () => { render(); maybeBotMove(); });
  botOnSel.addEventListener("change", () => { render(); maybeBotMove(); });

  function inside(r,c){ return r>=0 && r<8 && c>=0 && c<8; }

  function cloneState(state){
    return {
      b: state.b.map(row => row.slice()),
      turn: state.turn,
      castle: {...state.castle},
      ep: state.ep ? {r:state.ep.r, c:state.ep.c} : null,
      halfmove: state.halfmove,
      fullmove: state.fullmove,
      history: state.history.slice(),
      moveList: state.moveList.slice()
    };
  }

  function findKing(state, color){
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(state.b[r][c]===color+"K") return {r,c};
    return null;
  }

  function pseudoMovesFrom(state, r, c){
    const b = state.b;
    const p = b[r][c];
    if(!p) return [];
    const color = p[0], type=p[1];
    const opp = (color==="w") ? "b" : "w";
    const moves = [];
    const push = (toR,toC, extra={}) => moves.push({
      from:{r,c}, to:{r:toR,c:toC},
      piece:p, capture:b[toR][toC],
      ...extra
    });

    if(type==="P"){
      const dir = (color==="w") ? -1 : 1;
      const startRow = (color==="w") ? 6 : 1;
      const promRow = (color==="w") ? 0 : 7;

      const r1 = r+dir;
      if(inside(r1,c) && !b[r1][c]){
        push(r1,c, {promote: (r1===promRow) ? "Q" : null});
        const r2 = r+2*dir;
        if(r===startRow && !b[r2][c]) push(r2,c, {doublePawn:true});
      }
      for(const dc of [-1,+1]){
        const cc=c+dc;
        if(inside(r1,cc) && b[r1][cc] && b[r1][cc][0]===opp){
          push(r1,cc, {promote: (r1===promRow) ? "Q" : null});
        }
      }
      if(state.ep){
        if(r1===state.ep.r && Math.abs(c-state.ep.c)===1){
          push(state.ep.r, state.ep.c, {enPassant:true, capture: opp+"P"});
        }
      }
    }

    if(type==="N"){
      const deltas = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
      for(const [dr,dc] of deltas){
        const rr=r+dr, cc=c+dc;
        if(!inside(rr,cc)) continue;
        const t=b[rr][cc];
        if(!t || t[0]===opp) push(rr,cc);
      }
    }

    if(type==="B" || type==="R" || type==="Q"){
      const dirs = [];
      if(type==="B" || type==="Q") dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
      if(type==="R" || type==="Q") dirs.push([-1,0],[1,0],[0,-1],[0,1]);
      for(const [dr,dc] of dirs){
        let rr=r+dr, cc=c+dc;
        while(inside(rr,cc)){
          const t=b[rr][cc];
          if(!t) push(rr,cc);
          else { if(t[0]===opp) push(rr,cc); break; }
          rr+=dr; cc+=dc;
        }
      }
    }

    if(type==="K"){
      for(let dr=-1; dr<=1; dr++){
        for(let dc=-1; dc<=1; dc++){
          if(dr===0 && dc===0) continue;
          const rr=r+dr, cc=c+dc;
          if(!inside(rr,cc)) continue;
          const t=b[rr][cc];
          if(!t || t[0]===opp) push(rr,cc);
        }
      }
      if(color==="w" && r===7 && c===4){
        if(state.castle.wK && !b[7][5] && !b[7][6]) push(7,6, {castle:"K"});
        if(state.castle.wQ && !b[7][3] && !b[7][2] && !b[7][1]) push(7,2, {castle:"Q"});
      }
      if(color==="b" && r===0 && c===4){
        if(state.castle.bK && !b[0][5] && !b[0][6]) push(0,6, {castle:"K"});
        if(state.castle.bQ && !b[0][3] && !b[0][2] && !b[0][1]) push(0,2, {castle:"Q"});
      }
    }

    return moves;
  }

  function legalMovesFrom(state, r, c){
    const p = state.b[r][c];
    if(!p || p[0]!==state.turn) return [];
    const color = state.turn;
    const opp = (color==="w") ? "b" : "w";
    const pm = pseudoMovesFrom(state, r, c);
    const legal = [];

    for(const mv of pm){
      if(mv.castle){
        if(inCheck(state, color)) continue;
        const row = (color==="w") ? 7 : 0;
        if(mv.castle==="K"){
          if(isSquareAttacked(state,row,5,opp) || isSquareAttacked(state,row,6,opp)) continue;
        }else{
          if(isSquareAttacked(state,row,3,opp) || isSquareAttacked(state,row,2,opp)) continue;
        }
      }
      const st2 = applyMove(cloneState(state), mv);
      if(!inCheck(st2, color)) legal.push(mv);
    }
    return legal;
  }

  function allLegalMoves(state){
    const out = [];
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const p=state.b[r][c];
        if(p && p[0]===state.turn) out.push(...legalMovesFrom(state,r,c));
      }
    }
    return out;
  }

  function isSquareAttacked(state, r, c, byColor){
    const b = state.b;

    const dir = (byColor==="w") ? -1 : 1;
    const pr = r - dir;
    for(const dc of [-1, +1]){
      const pc = c - dc;
      if(inside(pr,pc) && b[pr][pc]===byColor+"P") return true;
    }

    const KN = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(const [dr,dc] of KN){
      const rr=r+dr, cc=c+dc;
      if(inside(rr,cc) && b[rr][cc]===byColor+"N") return true;
    }

    const diag = [[-1,-1],[-1,1],[1,-1],[1,1]];
    for(const [dr,dc] of diag){
      let rr=r+dr, cc=c+dc;
      while(inside(rr,cc)){
        const p=b[rr][cc];
        if(p){
          if(p[0]===byColor && (p[1]==="B" || p[1]==="Q")) return true;
          break;
        }
        rr+=dr; cc+=dc;
      }
    }

    const ort = [[-1,0],[1,0],[0,-1],[0,1]];
    for(const [dr,dc] of ort){
      let rr=r+dr, cc=c+dc;
      while(inside(rr,cc)){
        const p=b[rr][cc];
        if(p){
          if(p[0]===byColor && (p[1]==="R" || p[1]==="Q")) return true;
          break;
        }
        rr+=dr; cc+=dc;
      }
    }

    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(dr===0 && dc===0) continue;
        const rr=r+dr, cc=c+dc;
        if(inside(rr,cc) && b[rr][cc]===byColor+"K") return true;
      }
    }
    return false;
  }

  function inCheck(state, color){
    const k = findKing(state, color);
    if(!k) return false;
    const opp = (color==="w") ? "b" : "w";
    return isSquareAttacked(state, k.r, k.c, opp);
  }

  function applyMove(state, mv){
    const b = state.b;
    const {from,to} = mv;
    const piece = mv.piece;
    const color = piece[0], type = piece[1];
    const opp = (color==="w") ? "b" : "w";

    state.ep = null;
    const isPawn = (type==="P");
    const isCapture = !!mv.capture;
    state.halfmove = (isPawn || isCapture) ? 0 : (state.halfmove+1);

    b[from.r][from.c] = null;

    if(mv.enPassant){
      b[to.r][to.c] = piece;
      const capR = (color==="w") ? (to.r+1) : (to.r-1);
      b[capR][to.c] = null;
    } else {
      b[to.r][to.c] = piece;
    }

    if(mv.promote) b[to.r][to.c] = color + mv.promote;

    if(mv.doublePawn){
      const epR = (color==="w") ? (to.r+1) : (to.r-1);
      state.ep = {r: epR, c: to.c};
    }

    if(mv.castle){
      const row = (color==="w") ? 7 : 0;
      if(mv.castle==="K"){ b[row][7]=null; b[row][5]=color+"R"; }
      else { b[row][0]=null; b[row][3]=color+"R"; }
    }

    if(type==="K"){
      if(color==="w"){ state.castle.wK=false; state.castle.wQ=false; }
      else { state.castle.bK=false; state.castle.bQ=false; }
    }
    if(type==="R"){
      if(color==="w" && from.r===7 && from.c===0) state.castle.wQ=false;
      if(color==="w" && from.r===7 && from.c===7) state.castle.wK=false;
      if(color==="b" && from.r===0 && from.c===0) state.castle.bQ=false;
      if(color==="b" && from.r===0 && from.c===7) state.castle.bK=false;
    }
    if(mv.capture && mv.capture[1]==="R"){
      if(opp==="w" && to.r===7 && to.c===0) state.castle.wQ=false;
      if(opp==="w" && to.r===7 && to.c===7) state.castle.wK=false;
      if(opp==="b" && to.r===0 && to.c===0) state.castle.bQ=false;
      if(opp==="b" && to.r===0 && to.c===7) state.castle.bK=false;
    }

    state.turn = opp;
    if(state.turn==="w") state.fullmove++;
    return state;
  }

  function makeMove(state, mv, record){
    if(record){
      state.history.push({
        b: state.b.map(r=>r.slice()),
        turn: state.turn,
        castle: {...state.castle},
        ep: state.ep ? {r:state.ep.r,c:state.ep.c}:null,
        halfmove: state.halfmove,
        fullmove: state.fullmove,
        moveListLen: state.moveList.length
      });
    }
    const san = moveToSAN(state, mv);
    applyMove(state, mv);
    if(record) state.moveList.push(san);
  }

  function undo(state){
    const snap = state.history.pop();
    if(!snap) return;
    state.b = snap.b.map(r=>r.slice());
    state.turn = snap.turn;
    state.castle = {...snap.castle};
    state.ep = snap.ep ? {r:snap.ep.r,c:snap.ep.c}:null;
    state.halfmove = snap.halfmove;
    state.fullmove = snap.fullmove;
    state.moveList = state.moveList.slice(0, snap.moveListLen);
  }

  function sqName(r,c){ return "abcdefgh"[c] + (8-r); }

  function checkSuffixAfter(state, mv){
    const st2 = applyMove(cloneState(state), mv);
    const opp = st2.turn;
    const checked = inCheck(st2, opp);
    const moves = allLegalMoves(st2);
    if(checked && moves.length===0) return "#";
    if(checked) return "+";
    return "";
  }

  function moveToSAN(state, mv){
    if(mv.castle) return (mv.castle==="K") ? "O-O" : "O-O-O";
    const piece = mv.piece;
    const color = piece[0], type=piece[1];
    const capture = (mv.enPassant || mv.capture) ? "x" : "";
    const to = sqName(mv.to.r, mv.to.c);

    if(type!=="P"){
      let prefix = type;
      const others = [];
      for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){
          if(r===mv.from.r && c===mv.from.c) continue;
          const p = state.b[r][c];
          if(p===color+type){
            const leg = legalMovesFrom(state, r, c);
            if(leg.some(m => m.to.r===mv.to.r && m.to.c===mv.to.c)) others.push({r,c});
          }
        }
      }
      if(others.length){
        const needFile = !others.every(o => o.c !== mv.from.c);
        const needRank = !others.every(o => o.r !== mv.from.r);
        if(needFile) prefix += "abcdefgh"[mv.from.c];
        if(needRank) prefix += (8-mv.from.r);
      }
      return prefix + capture + to + (mv.promote ? "="+mv.promote : "") + checkSuffixAfter(state, mv);
    } else {
      const pawnPrefix = capture ? ("abcdefgh"[mv.from.c]) : "";
      return pawnPrefix + capture + to + (mv.promote ? "="+mv.promote : "") + checkSuffixAfter(state, mv);
    }
  }

  function gameStatus(state){
    const moves = allLegalMoves(state);
    const chk = inCheck(state, state.turn);
    if(moves.length===0){
      if(chk) return {over:true, message:`Checkmate. ${(state.turn==="w")?"Black":"White"} wins.`};
      return {over:true, message:"Stalemate. Draw."};
    }
    if(state.halfmove >= 100) return {over:true, message:"Draw by 50-move rule."};
    return {over:false, message:""};
  }

  function evalState(state){
    let score = 0;
    for(let r=0;r<8;r++){
      for(let c=0;c<8;c++){
        const p = state.b[r][c];
        if(!p) continue;
        const col = p[0], type=p[1];
        const base = pieceVal[type];
        const pst = PST[type] || null;
        let bonus = 0;
        if(pst){
          const rr = (col==="w") ? r : (7-r);
          bonus = pst[rr][c];
        }
        score += (col==="w" ? (base+bonus) : -(base+bonus));
      }
    }
    score += (state.turn==="w") ? 5 : -5;
    return score;
  }

  function botBestMove(state, depth){
    const moves = allLegalMoves(state);
    if(!moves.length) return null;

    const maximizing = (state.turn==="w");
    let best = null;
    let bestScore = maximizing ? -Infinity : Infinity;

    const ordered = moves.slice().sort((a,b) => (b.capture?1:0) - (a.capture?1:0));
    let alpha = -Infinity, beta = Infinity;

    for(const mv of ordered){
      const st2 = applyMove(cloneState(state), mv);
      const sc = minimax(st2, depth-1, alpha, beta);
      if(maximizing){
        if(sc > bestScore){ bestScore=sc; best=mv; }
        alpha = Math.max(alpha, bestScore);
      }else{
        if(sc < bestScore){ bestScore=sc; best=mv; }
        beta = Math.min(beta, bestScore);
      }
      if(beta <= alpha) break;
    }
    return best;
  }

  function minimax(state, depth, alpha, beta){
    const end = gameStatus(state);
    if(end.over){
      if(end.message.startsWith("Checkmate")) return (state.turn==="w") ? -999999 : 999999;
      return 0;
    }
    if(depth<=0) return evalState(state);

    const moves = allLegalMoves(state);
    const maximizing = (state.turn==="w");
    const ordered = moves.slice().sort((a,b) => (b.capture?1:0) - (a.capture?1:0));

    if(maximizing){
      let value = -Infinity;
      for(const mv of ordered){
        const st2 = applyMove(cloneState(state), mv);
        value = Math.max(value, minimax(st2, depth-1, alpha, beta));
        alpha = Math.max(alpha, value);
        if(beta <= alpha) break;
      }
      return value;
    } else {
      let value = Infinity;
      for(const mv of ordered){
        const st2 = applyMove(cloneState(state), mv);
        value = Math.min(value, minimax(st2, depth-1, alpha, beta));
        beta = Math.min(beta, value);
        if(beta <= alpha) break;
      }
      return value;
    }
  }

  function maybeBotMove(){
    const end = gameStatus(S);
    if(end.over) { render(); return; }
    if(botOnSel.value !== "on") return;
    if(S.turn !== "b") return;
    if(botBusy) return;

    botBusy = true;

    statusEl.textContent =
      `Turn: Black\nBot thinking...\nBot: On | Depth: ${depthSel.value}`;

    requestAnimationFrame(() => {
      setTimeout(() => {
        try{
          let depth = Math.max(1, Math.min(4, parseInt(depthSel.value, 10) || 2));
          if(/iPhone|iPad|iPod/i.test(navigator.userAgent)) depth = Math.min(depth, 3);

          const mv = botBestMove(S, depth);
          if(mv) makeMove(S, mv, true);
        } catch (err){
          console.error("Bot error:", err);
          alert("Bot engine error. Check the console on PC for details.");
        } finally {
          botBusy = false;
          render();
        }
      }, 0);
    });
  }

  render();
})();
</script>
</body>
</html>
